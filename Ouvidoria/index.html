<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ouvidoria - Clube Aramacan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Ouvidoria - Clube Aramacan</h1>

        <div class="tabs">
            <button class="tab-btn active" onclick="openTab('enviar')">Nova Manifestação</button>
            <button class="tab-btn" onclick="openTab('consultar')">Consultar Protocolo</button>
        </div>

        <!-- Seção: Enviar Manifestação -->
        <div id="enviar" class="tab-content active">
            <h2>Envie sua Manifestação</h2>
            <form id="manifestationForm">
                <div class="form-group">
                    <label for="name">Nome Completo</label>
                    <input type="text" id="name" name="name" required placeholder="Digite seu nome">
                </div>
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" required placeholder="Digite seu e-mail">
                </div>
                <div class="form-group">
                    <label for="message">Mensagem / Manifestação</label>
                    <textarea id="message" name="message" rows="5" required placeholder="Descreva sua solicitação, reclamação ou sugestão..."></textarea>
                </div>
                <button type="submit" class="btn">Enviar Manifestação</button>
            </form>
            <div id="formResult" class="result-message"></div>
        </div>

        <!-- Seção: Consultar Protocolo -->
        <div id="consultar" class="tab-content">
            <h2>Consultar Status</h2>
            <form id="searchForm">
                <div class="form-group">
                    <label for="protocolInput">Número do Protocolo</label>
                    <input type="text" id="protocolInput" name="protocolInput" required placeholder="Ex: ARAM-2026-XXXX">
                </div>
                <button type="submit" class="btn">Consultar</button>
            </form>
            <div id="searchResult" class="result-box hidden"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
